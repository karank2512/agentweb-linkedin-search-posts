name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Zero dependencies: nothing to install. The steps below run against the local mock and make no network calls.
      - run: npm test
      - run: npm run conformance
      - run: npm run demo
      - run: npm run demo:today
      - run: npm run eval
